name: Deploy QOE.FI to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 178.104.197.3
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "--- Synchronisation Git QOE.FI sur le VPS ---"
            cd /var/www/qoe.fi
            git remote set-url origin https://github.com/Flayrox/qoe.fi.git
            git fetch origin main
            git reset --hard origin/main

            echo "--- Build & Redémarrage Docker Compose QOE.FI ---"
            docker compose up -d --build --remove-orphans

            echo "✓ Auto-déploiement QOE.FI terminé avec succès !"
