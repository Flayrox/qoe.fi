name: CI Workflow

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-test:
    name: Build & Verify Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma:generate
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe?schema=public'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/qoe?schema=public'

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Lint Workspace
        run: pnpm lint

      - name: Run Unit & Integration Tests
        run: pnpm test
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe?schema=public'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/qoe?schema=public'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'
          SKIP_ENV_VALIDATION: 'true'

      - name: Build Production Packages & Applications
        run: pnpm build

  api-go:
    name: Go Backend (apps/api-go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api-go/go.mod
          cache-dependency-path: apps/api-go/go.sum

      - name: Vet, Build & Test Go Backend
        working-directory: apps/api-go
        run: |
          go vet ./...
          go build ./...
          go test ./...

  e2e:
    name: E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm e2e:install

      - name: Run E2E (public + self-contained suites)
        run: pnpm e2e --project=public-web
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3010'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe?schema=public'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
