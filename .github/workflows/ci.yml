name: CI Workflow

on:
  push:
    branches: [main, master, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
  pull_request:
    branches: [main, master, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

jobs:
  static-checks:
    name: Static Checks & Guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Guard seed-script (next/script + warning « script tag »)
        run: pnpm guard:seed-script

      - name: Guard legal-consent (consentement + registre des traceurs)
        run: pnpm guard:legal-consent

      # Passe 4 : plus aucune injection de HTML brut sans assainisseur.
      - name: Guard dangerous HTML (sanitize obligatoire)
        run: pnpm guard:dangerous-html

      # Registre des feature flags : TS (@qoe/flags) et Go (internal/flags)
      # doivent exposer exactement les mêmes clés et les mêmes défauts.
      - name: Guard flags parity (TS ↔ Go)
        run: pnpm guard:flags-parity

      # Liens d'article : les formes obsolètes (`/article/{slug}`) et les hôtes
      # codés en dur doivent passer par les résolveurs canoniques
      # (`buildArticlePath`, `getArticleUrl`, `resolveArticleShareUrl`).
      - name: Guard article links
        run: pnpm guard:article-links

      # Origine des médias : la liste des hôtes d'images est pilotée par
      # `NEXT_PUBLIC_MEDIA_CDN_URL` (une seule source, cf. AGENTS.md).
      - name: Guard media origin
        run: pnpm guard:media-origin

      # Passe 4 (T10) : cliquet sur les vulnérabilités high/critical connues.
      - name: Guard dependencies (pnpm audit, cliquet)
        run: pnpm audit:guard

      - name: Typecheck Monorepo
        run: pnpm typecheck

      - name: Lint Workspace
        run: pnpm lint

      - name: Guard UI debt (ratchet)
        run: pnpm ui:audit

      # Le guard était documenté dans AGENTS.md mais absent de la CI : il était
      # rouge sans que personne ne le voie (3 migrations sans CONCURRENTLY /
      # lock_timeout). Branché ici pour qu'il ne puisse plus pourrir.
      - name: Guard architecture (ratchet + DDL des migrations)
        run: pnpm arch:audit

  unit-and-coverage:
    name: Unit Tests & TS Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Run Unit & Integration Tests
        run: pnpm test
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'
          DIRECT_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'
          SKIP_ENV_VALIDATION: 'true'

      - name: TypeScript Coverage Gate (packages critiques)
        run: pnpm test:coverage

      - name: Upload TS Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ts
          path: coverage/ts/
          retention-days: 7
          if-no-files-found: ignore

  front-coverage:
    name: Front Coverage (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pkg: [ui, studio, admin, tenants]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Coverage Gate (@qoe/${{ matrix.pkg }})
        run: pnpm --filter @qoe/${{ matrix.pkg }} run test:coverage

      - name: Upload front coverage report (${{ matrix.pkg }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-front-${{ matrix.pkg }}
          path: coverage/
          retention-days: 7
          if-no-files-found: ignore

  build-and-test:
    name: Build Production Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Cache Turborepo & Next.js builds
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            apps/*/.next/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-dev-${{ hashFiles('pnpm-lock.yaml') }}-
            turbo-${{ runner.os }}-

      - name: Build Production Packages & Applications
        run: pnpm build

  api:
    name: Go Backend (apps/api shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # Testcontainers (tests d'intégration DB) a besoin du daemon Docker :
      # disponible nativement sur les runners ubuntu. On force l'isolation
      # réseau pour éviter les conflits de réseau Docker entre jobs.
      - name: Vet, Build & Test Go Backend (shard ${{ matrix.shard }})
        working-directory: apps/api
        run: |
          if [ "${{ matrix.shard }}" = "0" ]; then
            go vet ./...
            go build ./...
          fi
          PKGS=$(go list ./... | sort | awk -v s="${{ matrix.shard }}" 'NR % 3 == s')
          echo "Testing shard ${{ matrix.shard }}:"
          echo "$PKGS"
          echo "$PKGS" > shard_pkgs.txt
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic $PKGS
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      # Gate de couverture des modules critiques (contrat créateurs + worker) :
      # calculé directement depuis coverage.out (zéro double exécution Testcontainers).
      - name: Coverage Gate (modules critiques)
        working-directory: apps/api
        run: |
          set -e
          check() {
            pkg="$1"; threshold="$2"
            if ! grep -qx "github.com/qoefi/api/$pkg" shard_pkgs.txt; then
              return 0
            fi
            pct=$(awk -v pkg="github.com/qoefi/api/$pkg/" '
              index($0, pkg) == 1 {
                rest = substr($0, length(pkg) + 1)
                if (index(rest, "/") == 0) {
                  split($0, f, /[ :]+/)
                  st = f[length(f)-1]
                  cnt = f[length(f)]
                  tot += st
                  if (cnt > 0) cov += st
                }
              }
              END { if (tot > 0) printf "%.1f", cov * 100 / tot }
            ' coverage.out)
            if [ -z "$pct" ]; then
              echo "✗ $pkg : couverture non mesurée"
              exit 1
            fi
            if awk -v p="$pct" -v t="$threshold" 'BEGIN{exit !(p < t)}'; then
              echo "✗ $pkg : $pct% < seuil $threshold%"
              exit 1
            fi
            echo "✓ $pkg : $pct% (seuil $threshold%)"
          }
          check "internal/modules/articles" 50
          check "internal/modules/webhooks" 70
          check "internal/modules/settings" 60
          check "internal/modules/posts" 35
          check "internal/modules/search" 55
          check "internal/workers" 60
          # Modules couverts lors de la campagne P3 (2026-08) : gains
          # verrouillés — une baisse doit s'accompagner de nouveaux tests.
          check "internal/modules/notifications" 78
          check "internal/modules/events" 78
          check "internal/modules/workspaces" 82
          check "internal/modules/creator" 30
          check "internal/modules/highlights" 54
          check "internal/modules/analytics" 52
          check "internal/modules/users" 58
          check "internal/modules/oauth" 64
          check "internal/modules/home" 59
          check "internal/modules/admin" 64
          # Contrôle d'accès API (2026-09) : registre modulaire + middleware
          # (coupure générale / endpoints désactivés) — lancés à 80%.
          check "internal/apiaccess" 80
          check "internal/middleware" 80
          # Feature flags serveur (2026-09) : registre + cache TTL + GET /v1/flags
          # — base du coupe-feu worker (workers-newsletter-dispatch).
          check "internal/flags" 80
          # Newsletters (2026-09) : pipeline par lots rate-limité (campagnes +
          # releases d'articles) — anti-spam et synchro release.
          check "internal/modules/newsletters" 80
          # RBAC console admin — Phase 0 (2026-09) : capacités, résolution des
          # rôles (colonne legacy + grants), expiration et cache TTL, garde
          # HTTP. Tests live Postgres (Testcontainers) — lancés à 90%.
          check "internal/adminauthz" 90
          # Défense multi-couches (2026-11) : anti-spam/SimHash, trust temps réel,
          # secguard, anti-SSRF/MIME, Proof-of-Work Altcha et métriques Prometheus.
          check "internal/antispam" 70
          check "internal/trust" 65
          check "internal/secguard" 40
          check "internal/netguard" 75
          check "internal/pow" 80
          check "internal/observability" 85
          # Recours, support, identité et briques transverses (2026-11) :
          # élimination des 0 % et verrouillage des modules mesurés sans Docker.
          check "internal/modules/appeals" 90
          check "internal/modules/support" 90
          check "internal/identity" 95
          check "internal/canon" 80
          check "internal/slug" 85
          check "internal/umami" 85
          check "internal/deeplink" 65
          check "internal/modules/tracking" 70
          check "internal/modules/collaborations" 45
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  api-shared-db:
    name: Go Backend — base partagée (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # pnpm est requis pour la commande `pnpm test:api` (bash + Go + Docker
      # uniquement, pas de node_modules) : setup minimal sans install.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      # Mode base partagée : scripts/test-api.sh démarre la base de test
      # (docker-compose.test.yml, port 55432) si besoin, puis lance
      # go vet/build + go test -p 1 (packages sérialisés — les TRUNCATE des
      # fixtures ne peuvent pas s'exécuter en parallèle sur une base unique).
      # Complète le job `api` (Testcontainers, un conteneur par package).
      - name: Test Go Backend (base partagée, shard ${{ matrix.shard }})
        run: |
          PKGS=$(cd apps/api && go list ./cmd/... ./internal/... | sort | awk -v s="${{ matrix.shard }}" 'NR % 3 == s')
          pnpm test:api $PKGS

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # 94 tests dont la matrice de routes (22 navigations core + 39 contrôles
    # de redirection admin) : la borne précédente de 20 min coupait le job en
    # pleine exécution (step « cancelled »), ce qui ressemblait à un échec.
    timeout-minutes: 35

    # La page /home interroge la DB : sans Postgres, le serveur Next démarre
    # mais chaque requête DB échoue (500) → e2e rouge.
    # On monte un Postgres de service et on applique les migrations goose
    # avant (image pgvector : le schéma déclare extensions=[vector]).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qoe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qoe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Sans Redis, l'API Go retombe sur localhost:6379 et chaque requête
      # enchaîne 5 tentatives de dial (journal `redis: connection pool: failed
      # to dial`) : les lectures dépassent les timeouts Playwright (#article-content
      # jamais visible). Le cache est un service, pas une option.
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      # Schéma appliqué via les migrations goose (apps/api/sql/migrations) —
      # rejouables from-scratch (contrairement aux deltas Prisma).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Prepare Database (goose migrations)
        working-directory: apps/api
        run: go run ./cmd/migrate -dir sql/migrations up
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      # Contenu démo (articles publiés + publication certifiée + média) pour
      # que les tests e2e vérifient du contenu réellement rendu, pas seulement
      # l'absence d'erreurs. Seed Go (apps/api/cmd/seed — parité seed Prisma).
      - name: Seed Database (demo content)
        working-directory: apps/api
        run: go run ./cmd/seed
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm e2e:install

      # Les projets `routes` et `hydration` ont leur propre job (e2e-routes) :
      # plus courts, ils restent lisibles et à l'abri des timeouts du parcours
      # de lecture complet.
      # `oauth-consent` est exclu : ses 2 cas exigent un Supabase local
      # (GoTrue sur 127.0.0.1:54321) que ce job ne monte pas — ils étaient donc
      # sautés à chaque run, et un job vert qui saute des cas ne prouve rien.
      # Le parcours est couvert en local (cf. docs/PROD-READINESS-PLAN.md §5).
      # `--reporter=list` : le log doit nommer chaque cas exécuté.
      - name: Run E2E (public + journeys + security + standalone contracts)
        run: pnpm e2e --project=public-web --project=core-journeys --project=security --project=standalone-contracts --reporter=list
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3010'
          REDIS_URL: 'redis://localhost:6379'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # La matrice de routes a son propre job : 65 tests (22 cas core, 39 écrans
  # admin, garde d'inventaire, garde de variable d'environnement). Sans
  # PLAYWRIGHT_ADMIN_URL, e2e/routes.spec.ts échoue explicitement au lieu de
  # sauter les 39 pages admin — un job vert ne doit jamais vouloir dire
  # « matrice sautée ».
  e2e-routes:
    name: E2E Routes (core + console admin)
    runs-on: ubuntu-latest
    # Bâti pour durer : install + builds (~4 min) + 107 pages en quelques
    # secondes. 20 min laissent de la marge sans masquer une vraie dérive.
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qoe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qoe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Prepare Database (goose migrations)
        working-directory: apps/api
        run: go run ./cmd/migrate -dir sql/migrations up
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Seed Database (demo content)
        working-directory: apps/api
        run: go run ./cmd/seed
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm e2e:install

      # --project=routes : chaque page core/admin découverte sur le disque est
      # rendue (core) ou contrôlée en HTTP (admin : 307 + Location), et une page
      # sans test fait échouer le job.
      # --project=hydration : toute divergence entre le HTML rendu par le serveur
      # et le premier rendu client (React #418/#423…) échoue, même si la page
      # répond 200 et s'affiche correctement.
      # --reporter=list : le reporter par défaut n'imprime que des points, donc
      # un job vert ne prouvait pas QUELLES pages avaient été exécutées. Ici le
      # log nomme chaque cas (les 39 écrans admin, les 22 routes core, les
      # gardes) — un lecteur du run voit la couverture, pas seulement le total.
      # Trois `next dev` (core, admin, API) + Chromium saturaient la mémoire du
      # runner : le job était tué à ~6 min (« runner shutdown signal »), deux
      # fois de suite, après 68 tests verts. On sert un build : plus aucun
      # compilateur à la première visite (~35 s par app à construire).
      - name: Build core + admin for the route matrix
        run: pnpm intl:compile && pnpm --filter @qoe/core build && pnpm --filter @qoe/admin build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKIP_ENV_VALIDATION: 'true'
          QOE_API_URL: 'http://localhost:8090'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Run E2E (routes + hydratation)
        run: pnpm e2e --project=routes --project=hydration --reporter=list,html
        env:
          CI: 'true'
          PLAYWRIGHT_TEST_BASE_URL: 'http://localhost:3010'
          # La console (webServer de playwright.config.ts, PORT 15405) est
          # interrogée via lvh.me → 127.0.0.1.
          PLAYWRIGHT_ADMIN_URL: 'http://admin.lvh.me:15405'
          PLAYWRIGHT_ROUTES_PROD: '1'
          REDIS_URL: 'redis://localhost:6379'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'
          NEXT_PUBLIC_SUPABASE_URL: 'https://placeholder.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Upload Playwright Report (routes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-routes
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  e2e-apps:
    name: E2E Apps (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [tenants, studio, admin]

    # Les specs tenants/studio/admin interrogent la DB directement (fixtures)
    # et l'API Go (rendu). Même service Postgres que le job e2e principal.
    # Redis : l'API Go démarrée par playwright.apps.config.ts en a besoin
    # (rate-limiting + asynq) — sans elle, timeout 120 s sur `::1:6379`.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qoe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qoe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Prepare Database (goose migrations)
        working-directory: apps/api
        run: go run ./cmd/migrate -dir sql/migrations up
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Seed Database (demo content)
        working-directory: apps/api
        run: go run ./cmd/seed
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm e2e:install

      - name: Build app for E2E (next start)
        run: pnpm intl:compile && pnpm --filter @qoe/${{ matrix.app }} build
        env:
          # Le banc /dev/editor-check de studio n'existe qu'en dev : le spec
          # e2e/studio-editor-fixtures.spec.ts tourne sur ce build de
          # production, on l'autorise donc explicitement ici (jamais en prod).
          QOE_E2E_DEV_ROUTES: '1'
          NEXT_TELEMETRY_DISABLED: '1'
          SKIP_ENV_VALIDATION: 'true'
          QOE_API_URL: 'http://localhost:8091'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Run E2E (${{ matrix.app }})
        run: pnpm exec playwright test --config playwright.apps.config.ts --project=${{ matrix.app }} --grep-invert "Matrice de routes"
        env:
          CI: 'true'
          QOE_E2E_DEV_ROUTES: '1'
          PLAYWRIGHT_APPS_PROD: '1'
          PLAYWRIGHT_GO_API_PORT: '8091'
          QOE_API_URL: 'http://localhost:8091'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Upload Playwright Report (${{ matrix.app }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-apps-${{ matrix.app }}
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # La matrice de routes des apps secondaires a son propre job : elle rend
  # chaque page découverte de tenants (16), studio (24) et hi (4) et n'a aucun
  # récit fonctionnel en commun avec e2e-apps, qui était déjà proche de sa borne.
  # Un job dédié garde le log nominatif par page et un budget indépendant.
  e2e-apps-routes:
    name: E2E Apps Routes (tenants + studio + hi)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qoe
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qoe"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - '6379:6379'
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --fetch-timeout 600000

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Prepare Database (goose migrations)
        working-directory: apps/api
        run: go run ./cmd/migrate -dir sql/migrations up
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Seed Database (demo content)
        working-directory: apps/api
        run: go run ./cmd/seed
        env:
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'

      - name: Cache Playwright Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm e2e:install

      # La matrice visite les 47 cas : en `next dev`, chaque première visite
      # compile sa route et l'ensemble dépassait les 20 min (job annulé deux
      # fois). On sert donc un build réel (`PLAYWRIGHT_APPS_PROD=1`) : ~16 s pour
      # les matrices une fois les apps construites.
      - name: Build apps for the route matrix
        run: pnpm intl:compile && pnpm --filter @qoe/tenants build && pnpm --filter @qoe/studio build && pnpm --filter @qoe/hi build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          SKIP_ENV_VALIDATION: 'true'
          QOE_API_URL: 'http://localhost:8091'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      # Contrat par page (cf. e2e/lib/route-matrix.ts) : jamais 5xx, jamais
      # l'error boundary, redirection toujours avec un Location, inventaire non
      # vide. Le log nomme chaque page rendue (`[app] /chemin → statut`).
      - name: Run E2E apps route matrix
        run: pnpm exec playwright test --config playwright.apps.config.ts --project=tenants --project=studio --project=hi --grep "Matrice de routes"
        env:
          CI: 'true'
          PLAYWRIGHT_APPS_PROD: '1'
          PLAYWRIGHT_GO_API_PORT: '8091'
          QOE_API_URL: 'http://localhost:8091'
          DATABASE_URL: 'postgresql://postgres:postgres@localhost:5432/qoe'
          NEXT_PUBLIC_SUPABASE_URL: 'http://127.0.0.1:54321'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'placeholder_anon_key'

      - name: Upload Playwright Report (apps routes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-apps-routes
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  supply-chain-security:
    name: Supply Chain & Secret Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository (full history for gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scanning (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Go Vulnerability Check (govulncheck)
        # 🛡️ Bloquant volontairement : aucun contournement de guard (cf. AGENTS.md).
        # Une faille transitive sans correctif amont se traite par une allowlist
        # explicite et datée, jamais par un continue-on-error silencieux.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd apps/api && govulncheck ./...

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      # Audit des dépendances JS/TS : rapport non bloquant sur les CVE critiques
      # afin de ne pas casser la CI en cas d'indisponibilité du registre npm.
      - name: pnpm Vulnerability Audit (critical CVEs)
        continue-on-error: true
        run: pnpm audit --audit-level=critical
