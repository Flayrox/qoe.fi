      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementPage'
  /v1/posts/{id}/reposts:
    get:
      tags: [posts]
      summary: Users ayant reposté
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EngagementPage'
  /v1/posts/{id}/quotes:
    get:
      tags: [posts]
      summary: Citations (repostId + texte, FeedPost)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotesPage'
  /v1/users/{id}/block:
    post:
      tags: [users]
      summary: Toggle block
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, description: userId cible }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  blocked:
                    type: boolean
  /v1/users/{id}/mute:
    post:
      tags: [users]
      summary: Toggle mute
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  muted:
                    type: boolean
  /v1/reports:
    post:
      tags: [posts]
      summary: Signaler un contenu
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetId, targetType, reason]
              properties:
                targetId: { type: string }
                targetType: { type: string, enum: [thought, article, user, comment] }
                reason: { type: string }
                details: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /v1/users/me:
    get:
      tags: [users]
      summary: Profil courant (enveloppé data)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/MyProfile'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/users/{username}:
    get:
      tags: [users]
      summary: Profil public (slug/subdomain -> publication)
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/PublicProfile'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/users/{id}/follow:
    post:
      tags: [users]
      summary: Toggle follow (id = publicationId ou slug)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      following:
                        type: boolean
                      followersCount:
                        type: integer
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/users/{username}/followers:
    get:
      tags: [users]
      summary: Abonnés d'une publication
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
  /v1/users/{username}/following:
    get:
      tags: [users]
      summary: Abonnements d'un user (via owner de la publication)
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowPage'
  /v1/articles/{slug}:
    get:
      tags: [articles-public]
      summary: Lecture publique article (paywall) — double mode clé API vs viewer
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: publicationId
          in: query
          required: false
          description: requis en mode public (sans clé API)
          schema: { type: string }
        - name: viewerEmail
          in: query
          required: false
          schema: { type: string, format: email }
      responses:
        '200':
          description: Article complet (tronqué si paywall) ou CreatorItem si clé API
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ArticlePublic'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreatorItem'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/articles/{id}/similar:
    get:
      tags: [articles-public]
      summary: Recommandations sémantiques pgvector
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 6 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SimilarArticle'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/articles/{id}/comments:
    get:
      tags: [articles-public]
      summary: Commentaires d'article
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
    post:
      tags: [articles-public]
      summary: Créer commentaire
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                parentId: { type: string, nullable: true }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/articles/comments/{commentId}:
    delete:
      tags: [articles-public]
      summary: Supprimer son commentaire (auteur uniquement)
