                properties:
                  success: { type: boolean, example: true }
components:
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Supabase (RS256/ES256 JWKS ou HS256 sb_secret)
    apiKeyAuth:
      type: http
      scheme: bearer
      description: Clé API qoe_live_* (scopes READ/WRITE/ANALYTICS)
    bearerAuth:
      type: http
      scheme: bearer
      description: OAuth access_token
    internalSecret:
      type: apiKey
      in: header
      name: x-qoe-internal-secret
  parameters:
    Cursor:
      name: cursor
      in: query
      schema: { type: string, default: '0' }
      description: Offset int en string
    Limit20:
      name: limit
      in: query
      schema: { type: integer, default: 20, minimum: 1, maximum: 100 }
    Limit50:
      name: limit
      in: query
      schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
  responses:
    BadRequest:
      description: Requête invalide
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Non authentifié
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Permission insuffisante
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Introuvable
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    FeedAuthor:
      type: object
      required: [id, isCertified]
      properties:
        id: { type: string }
        name: { type: string, nullable: true }
        username: { type: string, nullable: true }
        logoUrl: { type: string, nullable: true }
        isCertified: { type: boolean }
        isFollowing: { type: boolean }
    FeedAttachment:
      type: object
      properties:
        id: { type: string }
        thoughtId: { type: string }
        type: { type: string }
        url: { type: string }
        altText: { type: string, nullable: true }
        width: { type: integer, nullable: true }
        height: { type: integer, nullable: true }
        order: { type: integer }
    FeedPollOption:
      type: object
      properties:
        id: { type: string }
        text: { type: string }
        order: { type: integer }
        voteCount: { type: integer }
        percentage: { type: number }
    Poll:
      type: object
      properties:
        id: { type: string }
        thoughtId: { type: string }
        expiresAt: { type: string, format: date-time }
        isExpired: { type: boolean }
        totalVotes: { type: integer }
        userVotedOptionId: { type: string, nullable: true }
        options:
          type: array
          items: { $ref: '#/components/schemas/FeedPollOption' }
    FeedPost:
      type: object
      required: [id, content, authorId, createdAt]
      properties:
        id: { type: string }
        content: { type: string }
        authorId: { type: string }
        createdAt: { type: string, format: date-time }
        tags: { type: array, items: { type: string } }
        imageUrl: { type: string, nullable: true }
        likeCount: { type: integer }
        repostCount: { type: integer }
        replyCount: { type: integer }
        parentId: { type: string, nullable: true }
        rootId: { type: string, nullable: true }
        repostId: { type: string, nullable: true }
