      tags: [highlights]
      summary: Commentaires d'annotation
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnnotationComment'
    post:
      tags: [highlights]
      summary: Créer commentaire d'annotation
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnnotationComment'
  /v1/highlights/comments/{commentId}:
    delete:
      tags: [highlights]
      summary: Supprimer son commentaire d'annotation
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /v1/bookmarks:
    get:
      tags: [bookmarks]
      summary: Bibliothèque bookmarks paginés (offset)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookmarkItem'
  /v1/me/highlights:
    get:
      tags: [bookmarks]
      summary: Mes highlights paginés (offset)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
