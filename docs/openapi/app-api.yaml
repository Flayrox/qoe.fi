            schema:
              type: object
              required: [optionId]
              properties:
                optionId:
                  type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/posts/{id}/poll/unvote:
    post:
      tags: [posts]
      summary: Retirer vote
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
  /v1/posts/{id}/likes:
    get:
      tags: [posts]
      summary: Users ayant liké (paginé)
