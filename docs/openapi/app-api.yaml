          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /v1/articles/{id}/highlights:
    get:
      tags: [highlights]
      summary: Surlignages d'un article (publics + siens)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Highlight'
    post:
      tags: [highlights]
      summary: Créer surlignage
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                note: { type: string, nullable: true }
                isPublic: { type: boolean }
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Highlight'
  /v1/highlights/{id}:
    delete:
      tags: [highlights]
      summary: Supprimer son surlignage
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
  /v1/highlights/{id}/upvote:
    post:
      tags: [highlights]
      summary: Toggle upvote
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  upvoted: { type: boolean }
                  upvotesCount: { type: integer }
  /v1/highlights/{id}/comments:
