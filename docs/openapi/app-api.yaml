# 📱 qoe.fi — API App (mobile + web) — OpenAPI 3.1
# Source de vérité: apps/api/cmd/server/main.go + apps/api/internal/modules/*/handler.go
# Généré 2026-08-21 — vérifié contre le code Go.
openapi: 3.1.0
info:
  title: qoe.fi — API App
  version: 1.0.0
  description: >-
    API consommée par l'app mobile (apps/mobile) et le web via
    QoeApiClient (packages/api-client/src/client.ts). Auth JWT Supabase
    (OptionalAuth vs CombinedAuth), rate-limit 120/min public + 600/min
    user, pagination cursor/offset vs page (créateurs). Voir
    docs/API_COMPLETE.md pour les exemples détaillés.
  contact:
    name: qoe.fi
    url: https://qoe.fi
servers:
  - url: https://api.qoe.fi
    description: Production
  - url: http://localhost:8080
    description: Développement
tags:
  - name: health
  - name: feed
  - name: posts
  - name: users
  - name: articles-public
  - name: highlights
  - name: bookmarks
  - name: notifications
  - name: search
  - name: settings
  - name: billing
  - name: internal
  - name: oauth
security:
  - jwtAuth: []
paths:
  /healthz:
    get:
      tags: [health]
      summary: Healthcheck
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /health:
    get:
      tags: [health]
      summary: Healthcheck alias
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /v1/feed/:
    get:
      tags: [feed]
      summary: Feed abonnements (following) — protégé
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit20'
      responses:
        '200':
          description: FeedSlice paginé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResult'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/feed/trending:
    get:
      tags: [feed]
      summary: Feed trending 7j — public (OptionalAuth)
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit20'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResult'
  /v1/feed/articles:
    get:
      tags: [feed]
      summary: Articles récents (feed mobile) — public
      security: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit20'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleFeedResult'
  /v1/posts/{id}/thread:
    get:
      tags: [feed]
      summary: Fil complet d'un post (ancêtres + replies)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  post:
                    allOf:
                      - $ref: '#/components/schemas/FeedPost'
                      - type: object
                        properties:
                          replies:
                            type: array
                            items:
                              $ref: '#/components/schemas/FeedPost'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/users/{username}/posts:
    get:
      tags: [feed]
      summary: Pensées d'un profil (public, slug/subdomain)
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit20'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedResult'
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/users/{username}/articles:
    get:
      tags: [feed]
      summary: Articles d'un profil (public)
      security: []
      parameters:
        - name: username
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit20'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleFeedResult'
  /v1/posts:
    post:
      tags: [posts]
      summary: Créer une pensée (ou citation si repostId)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThoughtInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/thoughts:
    post:
      tags: [posts]
      summary: Alias /v1/posts
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThoughtInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
  /v1/posts/{id}:
    get:
      tags: [posts]
      summary: Lire une pensée
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [posts]
      summary: Supprimer sa pensée (soft)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/posts/{id}/like:
    post:
      tags: [posts]
      summary: Toggle like
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
  /v1/thoughts/{id}/like:
    post:
      tags: [posts]
      summary: Alias like
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  liked:
                    type: boolean
  /v1/posts/{id}/repost:
    post:
      tags: [posts]
      summary: Toggle repost pur
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reposted:
                    type: boolean
  /v1/thoughts/{id}/repost:
    post:
      tags: [posts]
      summary: Alias repost
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  reposted:
                    type: boolean
  /v1/posts/{id}/reply:
    post:
      tags: [posts]
      summary: Répondre (threadgate vérifié)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedPost'
        '400': { $ref: '#/components/responses/BadRequest' }
  /v1/posts/{id}/bookmark:
    post:
      tags: [posts]
      summary: Toggle bookmark article (targetType ignoré côté Go)
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                targetType:
                  type: string
                  enum: [thought, article]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarked:
                    type: boolean
  /v1/thoughts/{id}/bookmark:
    post:
      tags: [posts]
      summary: Alias bookmark
      security:
        - jwtAuth: []
        - apiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookmarked:
                    type: boolean
  /v1/posts/{id}/pin:
