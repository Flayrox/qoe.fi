# =====================================================================
# 🐳 docker-compose.dev.yml — qoe.fi monorepo (DÉVELOPPEMENT)
# =====================================================================
# 📖 HMR activé sur tenants + core (bind mount du code source).
#    Tu modifies un fichier dans VSCode → le container le voit
#    immédiatement, Next.js recompile.
#
# 🚀 Usage :
#    npm run docker:dev
#    ou :
#    docker compose -f docker-compose.dev.yml up
#
# 🌐 Accès :
#    Hi (hi.qoe.fi)            : http://localhost:3001
#    Core (qoe.fi)             : http://localhost:3010
#    API (api.qoe.fi)          : http://localhost:3002
#    Prisma Studio             : http://localhost:5555
#    PostgreSQL                : localhost:5433 (via pgAdmin/DBeaver)
#    Redis                     : localhost:6379
#    GrowthBook (flags UI)     : http://localhost:3100
#    GrowthBook (SDK/API)      : http://localhost:3200
# =====================================================================

# Indique que ce fichier étend docker-compose.yml
# (mais on le rend autonome pour la clarté)

name: qoefi-dev

services:
  # ───────────────────────────────────────────────────────────────────
  # 🐘 POSTGRES (dev)
  # ───────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: qoefi-dev-db
    restart: unless-stopped

    # Port exposé pour pgAdmin / DBeaver depuis ton PC
    ports:
      - '5433:5432'

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qoe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qoe}
      POSTGRES_DB: ${POSTGRES_DB:-qoe}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8'

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-qoe} -d ${POSTGRES_DB:-qoe}']
      interval: 5s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────
  # 🔍 MEILISEARCH : Moteur de recherche
  # ───────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: qoefi-meilisearch
    restart: unless-stopped
    ports:
      - '7700:7700'
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-qoe_master_key_123}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data

  # ───────────────────────────────────────────────────────────────────
  # 🔄 REDIS (dev)
  # ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qoefi-dev-redis
    restart: unless-stopped

    ports:
      - '6379:6379'

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3

  # ───────────────────────────────────────────────────────────────────
  # 🍃 MONGODB (dev) — stockage du dashboard GrowthBook
  # ───────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: qoefi-dev-mongodb
    restart: unless-stopped

    ports:
      - '27018:27017'

    volumes:
      - mongodb_dev_data:/data/db

    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand("ping").ok']
      interval: 5s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────
  # 🚩 GROWTHBOOK : dashboard de feature flags (self-hosté)
  # ───────────────────────────────────────────────────────────────────
  # 📖 UI : http://localhost:3100  (crée ton compte admin au 1er run,
  #    puis Settings → SDK Connections pour générer la clé `sdk-...`)
  #    API SDK : http://localhost:3200 (ce que consomment @qoe/flags)
  # ───────────────────────────────────────────────────────────────────
  growthbook:
    image: growthbook/growthbook:latest
    container_name: qoefi-dev-growthbook
    restart: unless-stopped

    ports:
      - '3100:3000' # UI dashboard
      - '3200:3100' # API (endpoint SDK /api/features/<key>)

    environment:
      MONGODB_URI: mongodb://mongodb:27017/growthbook
      REDIS_URI: redis://redis:6379
      APP_ORIGIN: http://localhost:3100
      API_HOST: http://localhost:3200
      NODE_ENV: production
      JWT_SECRET: ${GROWTHBOOK_JWT_SECRET:-qoe_growthbook_dev_jwt_secret_change_me}
      ENCRYPTION_KEY: ${GROWTHBOOK_ENCRYPTION_KEY:-qoe_growthbook_dev_encryption_key_change_me}
      DISABLE_TELEMETRY: 'true'
      EMAIL_ENABLED: 'false'
      # Origines autorisées pour le SDK navigateur (streaming SSE)
      CORS_ALLOWED_ORIGINS: 'http://localhost:3001,http://localhost:3010,http://localhost:3020,http://localhost:3030,http://localhost:3040'

    volumes:
      - growthbook_uploads:/usr/local/src/app/packages/back-end/uploads

    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────
  # 🔄 MIGRATE (dev, one-shot — goose)
  # ───────────────────────────────────────────────────────────────────
  # 📖 En dev, on n'utilise PAS le multi-stage Dockerfile : image golang
  #    simple + bind mount de apps/api, `go run ./cmd/migrate up`.
  migrate:
    image: golang:1.26-alpine
    container_name: qoefi-dev-migrate
    restart: 'no'

    working_dir: /app/apps/api

    environment:
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres

    # Bind mount du code source (pas besoin de rebuild pour migrate)
    volumes:
      - ./apps/api:/app/apps/api

    command: sh -c "go run ./cmd/migrate -dir /app/apps/api/sql/migrations up"

    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────
  # 🌐 TENANTS : Next.js public (HMR)
  # ───────────────────────────────────────────────────────────────────
  tenants:
    # En dev, on n'utilise pas le multi-stage Dockerfile
    # On utilise un node:20 simple + bind mount pour HMR
    image: node:22-alpine
    container_name: qoefi-dev-tenants
    restart: unless-stopped

    working_dir: /app
    ports:
      - '4001:3000'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # HMR polling (nécessaire sur Windows/Mac avec Docker Desktop)
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379

    # 🎯 BIND MOUNT : ton code source est monté en temps réel
    volumes:
      - ./apps/tenants:/app/apps/tenants
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      # Exclut node_modules du container (utilise celui du container)
      - /app/apps/tenants/node_modules
      - /app/apps/tenants/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install --frozen-lockfile --filter @qoe/tenants... && cd apps/tenants && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 📣 HI : Next.js marketing (HMR)
  # ───────────────────────────────────────────────────────────────────
  hi:
    image: node:22-alpine
    container_name: qoefi-dev-hi
    restart: unless-stopped

    working_dir: /app
    ports:
      - '4040:3040'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3040
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/hi:/app/apps/hi
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/hi/node_modules
      - /app/apps/hi/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install --frozen-lockfile --filter @qoe/hi... && cd apps/hi && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 📰 CORE : Next.js reader (HMR)
  # ───────────────────────────────────────────────────────────────────
  core:
    image: node:22-alpine
    container_name: qoefi-dev-core
    restart: unless-stopped

    working_dir: /app
    ports:
      - '4000:3010'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3010
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/core:/app/apps/core
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/core/node_modules
      - /app/apps/core/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install --frozen-lockfile --filter @qoe/core... && cd apps/core && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 🎨 STUDIO : Next.js creator (HMR)
  # ───────────────────────────────────────────────────────────────────
  studio:
    image: node:22-alpine
    container_name: qoefi-dev-studio
    restart: unless-stopped


    working_dir: /app
    ports:
      - '4020:3020'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3020
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/studio:/app/apps/studio
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/studio/node_modules
      - /app/apps/studio/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install --frozen-lockfile --filter @qoe/studio... && cd apps/studio && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 🛡️ ADMIN : Next.js superadmin (HMR)
  # ───────────────────────────────────────────────────────────────────
  admin:
    image: node:22-alpine
    container_name: qoefi-dev-admin
    restart: unless-stopped

    working_dir: /app
    ports:
      - '4030:3030'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3030
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install --frozen-lockfile --filter @qoe/admin... && cd apps/admin && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 🔍 PRISMA STUDIO (UI web pour la DB) — optionnel
  # ───────────────────────────────────────────────────────────────────
  prisma-studio:
    image: node:22-alpine
    container_name: qoefi-dev-prisma-studio
    restart: unless-stopped

    working_dir: /app
    ports:
      - '5555:5555'

    environment:
      CI: 'true'
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres

    volumes:
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@11.21.0 --activate && pnpm install --frozen-lockfile && cd packages/db && pnpm prisma studio --port 5555"

    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────
  # 🧠 EMBEDDING — Inférence jina-embeddings-v3 auto-hébergée (LOCAL)
  # ───────────────────────────────────────────────────────────────────
  # ⚠️ PAS de service Docker ici : l'image TEI n'existe pas en arm64, et
  #    ton Mac est un Apple Silicon. En dev local on utilise llama.cpp
  #    natif (jina-embeddings-v3 Q8_0) servi par launchd sur :8081 :
  #
  #    launchctl bootstrap gui/$(id -u) ~/Library/LaunchAgents/com.qoefi.embedding-server.plist
  #    (fichiers sources : scripts/launchd/ — modèle dans ~/.qoefi/models/)
  #
  #    Santé : curl http://127.0.0.1:8081/health  →  {"status":"ok"}
  #    En PROD (VPS amd64), le service TEI est dans docker-compose.yml.
  # ───────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────
  # 📊 UMAMI ANALYTICS (Auto-hébergé local dev)
  # ───────────────────────────────────────────────────────────────────
  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: qoefi-dev-umami
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # DB DÉDIÉE à Umami (schéma séparé) — la migration Prisma d'Umami
      # refuse de s'exécuter sur une DB non vide (P3005) : on crée la base
      # `umami` à côté de la base app (docker/postgres/init.sql).
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/umami?schema=public
      DATABASE_TYPE: postgresql
      HASH_SALT: qoe_umami_dev_salt_32_chars_long
      APP_SECRET: qoe_umami_app_secret_dev_32_chars
    depends_on:
      db:
        condition: service_healthy

# =====================================================================
# 📦 VOLUMES
# =====================================================================
volumes:
  postgres_dev_data:
    name: qoefi-dev-postgres-data
  meilisearch_data:
    name: qoefi-dev-meilisearch-data
  mongodb_dev_data:
    name: qoefi-dev-mongodb-data
  growthbook_uploads:
    name: qoefi-dev-growthbook-uploads
