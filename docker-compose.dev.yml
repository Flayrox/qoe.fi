# =====================================================================
# 🐳 docker-compose.dev.yml — qoe.fi monorepo (DÉVELOPPEMENT)
# =====================================================================
# 📖 HMR activé sur web + console (bind mount du code source).
#    Tu modifies un fichier dans VSCode → le container le voit
#    immédiatement, Next.js recompile.
#
# 🚀 Usage :
#    npm run docker:dev
#    ou :
#    docker compose -f docker-compose.dev.yml up
#
# 🌐 Accès :
#    Web (start.qoe.fi)        : http://localhost:3001
#    Console (qoe.fi)          : http://localhost:3010
#    API (api.qoe.fi)          : http://localhost:3002
#    Prisma Studio             : http://localhost:5555
#    PostgreSQL                : localhost:5433 (via pgAdmin/DBeaver)
#    Redis                     : localhost:6379
# =====================================================================

# Indique que ce fichier étend docker-compose.yml
# (mais on le rend autonome pour la clarté)

name: qoefi-dev

services:
  # ───────────────────────────────────────────────────────────────────
  # 🐘 POSTGRES (dev)
  # ───────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: qoefi-dev-db
    restart: unless-stopped

    # Port exposé pour pgAdmin / DBeaver depuis ton PC
    ports:
      - "5433:5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qoe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qoe}
      POSTGRES_DB: ${POSTGRES_DB:-qoe}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"

    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qoe} -d ${POSTGRES_DB:-qoe}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ───────────────────────────────────────────────────────────────────
  # 🔄 REDIS (dev)
  # ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qoefi-dev-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

  # ───────────────────────────────────────────────────────────────────
  # 🔄 MIGRATE (dev, one-shot)
  # ───────────────────────────────────────────────────────────────────
  # 📖 En dev, on n'utilise PAS le multi-stage Dockerfile.
  #    On utilise une image node:20-alpine simple + pnpm install direct.
  #    C'est plus rapide et ça évite le bug pnpm isolated en Docker.
  migrate:
    image: node:22-alpine
    container_name: qoefi-dev-migrate
    restart: "no"

    working_dir: /app

    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public

    # Bind mount du code source (pas besoin de rebuild pour migrate)
    volumes:
      - ./apps/landing:/app/apps/landing
      - ./apps/feed:/app/apps/feed
      - ./apps/dashboard:/app/apps/dashboard
      - ./apps/admin:/app/apps/admin
      - ./apps/api:/app/apps/api
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./prisma.config.ts:/app/prisma.config.ts
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc

    command: >
      sh -c "corepack enable &&
             corepack prepare pnpm@9.15.0 --activate &&
             pnpm install --frozen-lockfile --filter @qoe/db... &&
             cd packages/db &&
             pnpm exec prisma migrate deploy --schema=prisma/schema.prisma"

    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────
  # 🌐 WEB : Next.js public (HMR)
  # ───────────────────────────────────────────────────────────────────
  web:
    # En dev, on n'utilise pas le multi-stage Dockerfile
    # On utilise un node:20 simple + bind mount pour HMR
    image: node:22-alpine
    container_name: qoefi-dev-web
    restart: unless-stopped

    working_dir: /app
    ports:
      - "4001:3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # HMR polling (nécessaire sur Windows/Mac avec Docker Desktop)
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      REDIS_URL: redis://redis:6379

    # 🎯 BIND MOUNT : ton code source est monté en temps réel
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      # Exclut node_modules du container (utilise celui du container)
      - /app/apps/web/node_modules
      - /app/apps/web/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @qoe/web... && cd apps/web && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 📣 LANDING : Next.js marketing (HMR)
  # ───────────────────────────────────────────────────────────────────
  landing:
    image: node:22-alpine
    container_name: qoefi-dev-landing
    restart: unless-stopped

    working_dir: /app
    ports:
      - "4040:3040"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3040
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/landing:/app/apps/landing
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/landing/node_modules
      - /app/apps/landing/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @qoe/landing... && cd apps/landing && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 📰 FEED : Next.js reader (HMR)
  # ───────────────────────────────────────────────────────────────────
  feed:
    image: node:22-alpine
    container_name: qoefi-dev-feed
    restart: unless-stopped

    working_dir: /app
    ports:
      - "4000:3010"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3010
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/feed:/app/apps/feed
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/feed/node_modules
      - /app/apps/feed/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @qoe/feed... && cd apps/feed && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 🎨 DASHBOARD : Next.js creator (HMR)
  # ───────────────────────────────────────────────────────────────────
  dashboard:
    image: node:22-alpine
    container_name: qoefi-dev-dashboard
    restart: unless-stopped

    working_dir: /app
    ports:
      - "4020:3020"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3020
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/dashboard:/app/apps/dashboard
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/dashboard/node_modules
      - /app/apps/dashboard/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @qoe/dashboard... && cd apps/dashboard && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 🛡️ ADMIN : Next.js superadmin (HMR)
  # ───────────────────────────────────────────────────────────────────
  admin:
    image: node:22-alpine
    container_name: qoefi-dev-admin
    restart: unless-stopped

    working_dir: /app
    ports:
      - "4030:3030"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3030
      HOSTNAME: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/admin:/app/apps/admin
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/admin/node_modules
      - /app/apps/admin/.next
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @qoe/admin... && cd apps/admin && pnpm dev"

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # ───────────────────────────────────────────────────────────────────
  # 🔌 API : Hono backend (HMR)
  # ───────────────────────────────────────────────────────────────────
  api:
    image: node:22-alpine
    container_name: qoefi-dev-api
    restart: unless-stopped

    working_dir: /app
    ports:
      - "4002:3001"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: development
      PORT: 3001
      HOSTNAME: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public
      REDIS_URL: redis://redis:6379

    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc
      - /app/apps/api/node_modules
      - /app/packages/*/node_modules

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile --filter @qoe/api... && cd apps/api && pnpm dev"

    depends_on:
      db:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────
  # 🔍 PRISMA STUDIO (UI web pour la DB) — optionnel
  # ───────────────────────────────────────────────────────────────────
  prisma-studio:
    image: node:22-alpine
    container_name: qoefi-dev-prisma-studio
    restart: unless-stopped

    working_dir: /app
    ports:
      - "5555:5555"

    environment:
      CI: "true"
      DATABASE_URL: postgresql://${POSTGRES_USER:-qoe}:${POSTGRES_PASSWORD:-qoe}@db:5432/${POSTGRES_DB:-qoe}?schema=public

    volumes:
      - ./packages:/app/packages
      - ./package.json:/app/package.json
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./.npmrc:/app/.npmrc

    command: sh -c "cd /app && corepack enable && corepack prepare pnpm@9.15.0 --activate && pnpm install --frozen-lockfile && cd packages/db && pnpm prisma studio --port 5555"

    depends_on:
      db:
        condition: service_healthy

# =====================================================================
# 📦 VOLUMES
# =====================================================================
volumes:
  postgres_dev_data:
    name: qoefi-dev-postgres-data
