# =====================================================================
# 🐳 docker-compose.yml — qoe.fi monorepo (PRODUCTION)
# =====================================================================
# 📖 15 services :
#   1. caddy      : reverse proxy + TLS (seul service exposé au public)
#   2. web        : Next.js tenants (wildcard *.qoe.fi)
#   3. landing    : Next.js marketing (start.qoe.fi)
#   4. feed       : Next.js reader (qoe.fi)
#   5. dashboard  : Next.js créateurs (dashboard.qoe.fi)
#   6. admin      : Next.js plateforme (admin.qoe.fi)
#   7. api        : backend-of-record Go (api.qoe.fi) — apps/api-go
#   8. worker-go  : worker asynq Go (webhooks, newsletter, embeddings)
#   9. worker-node: workers BullMQ Node (emails, AI, billing)
#   10. embedding : llama.cpp — jina-embeddings-v3 (inférence locale)
#   11. redis     : cache + queue
#   12. meilisearch: full-text search (réseau interne uniquement)
#   13. umami     : analytics self-hosted
#   14. umami-db  : PostgreSQL d'umami
#   15. migrate   : one-shot Prisma migrate (s'exécute puis s'arrête)
#
# 🔒 Segmentation réseau par rôle :
#   qoefi-public  : caddy + frontends (web/landing/feed/dashboard/admin/umami)
#                   + supabase-kong/supabase-studio (voir l'override Supabase
#                   créé par bootstrap.sh → docker-compose.override.yml).
#                   Caddy n'a PAS accès au réseau supabase (donc pas à la DB).
#   qoefi-private : tout le reste (api, workers, redis, meili, embedding).
#   supabase_default : UNIQUEMENT api, worker-go, worker-node et migrate
#                      (accès à la DB Supabase). Pas les frontends, pas caddy.
#
# 📖 Convention de nommage : kebab-case, préfixe qoefi-, nom de service = nom
#    de conteneur. Le DNS interne Docker utilise le NOM DE SERVICE (pas le
#    container_name) — les deux restent donc synchronisés.
# =====================================================================

name: qoefi

services:
  # ───────────────────────────────────────────────────────────────────
  # 🚪 CADDY : reverse proxy + TLS (ports publics)
  # ───────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: qoefi-caddy
    restart: unless-stopped

    # Écoute publique
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - /etc/letsencrypt:/etc/letsencrypt:ro

    # Caddy a besoin de connaître les autres services
    depends_on:
      web:
        condition: service_started
      feed:
        condition: service_started
      dashboard:
        condition: service_started
      admin:
        condition: service_started
      landing:
        condition: service_started

    # 🔒 Réseau PUBLIC uniquement : atteint les frontends (qoefi-public)
    #    et kong/studio (via le réseau qoefi-public partagé par l'override
    #    Supabase). Jamais le réseau supabase_default → pas d'accès à la DB.
    networks:
      - qoefi-public

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 🌐 WEB : Next.js tenants (wildcard *.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: qoefi-web:latest
    container_name: qoefi-web
    restart: unless-stopped

    # PAS de port public : seul Caddy y accède
    expose:
      - '3000'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # URLs publiques (utilisées pour les redirects, emails, etc.)
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      # Backend-of-record Go (réseau privé Docker, jamais public).
      QOE_API_GO_URL: http://api:8080
      # Supabase (lu côté serveur via l'app)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.5'
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 📣 LANDING : Next.js marketing (start.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      target: landing
    image: qoefi-landing:latest
    container_name: qoefi-landing
    restart: unless-stopped

    expose:
      - '3000'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      # Backend-of-record Go (réseau privé Docker, jamais public).
      QOE_API_GO_URL: http://api:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 📰 FEED : Next.js public reader (qoe.fi / www.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  feed:
    build:
      context: .
      dockerfile: Dockerfile
      target: feed
    image: qoefi-feed:latest
    container_name: qoefi-feed
    restart: unless-stopped

    expose:
      - '3000'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      # Backend-of-record Go (réseau privé Docker, jamais public).
      QOE_API_GO_URL: http://api:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 🎨 DASHBOARD : Next.js creator (dashboard.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    image: qoefi-dashboard:latest
    container_name: qoefi-dashboard
    restart: unless-stopped

    expose:
      - '3000'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      # Backend-of-record Go (réseau privé Docker, jamais public).
      QOE_API_GO_URL: http://api:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 🛡️ ADMIN : Next.js platform admin (admin.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    image: qoefi-admin:latest
    container_name: qoefi-admin
    restart: unless-stopped

    expose:
      - '3000'

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      # Backend-of-record Go (réseau privé Docker, jamais public).
      QOE_API_GO_URL: http://api:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # ⚙️ WORKER-NODE : BullMQ background jobs (emails, AI, billing)
  # ───────────────────────────────────────────────────────────────────
  worker-node:
    build:
      context: .
      dockerfile: Dockerfile
      target: workers
    image: qoefi-worker-node:latest
    container_name: qoefi-worker-node
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Resend (emails)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@qoe.fi}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-private
      - supabase_default # 🔒 DB via Prisma uniquement

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # ⚡ API (backend-of-record Go) : serveur REST — apps/api-go
  # ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
    image: qoefi-api:latest
    container_name: qoefi-api
    restart: unless-stopped

    expose:
      - '8080'

    env_file:
      - .env.docker

    environment:
      PORT: 8080
      API_PORT: 8080
      REDIS_URL: redis://redis:6379
      QOE_INTERNAL_SECRET: ${QOE_INTERNAL_SECRET:-}
      # Umami self-hosted (réseau Docker). L'API REST v2 est sous /api (vs /v1 cloud).
      UMAMI_API_URL: http://umami:3000/api
      # Auth : soit UMAMI_API_KEY (cloud), soit UMAMI_USERNAME/UMAMI_PASSWORD (self-hosted v2).
      UMAMI_API_KEY: ${UMAMI_API_KEY:-}
      UMAMI_USERNAME: ${UMAMI_USERNAME:-}
      UMAMI_PASSWORD: ${UMAMI_PASSWORD:-}
      NEXT_PUBLIC_UMAMI_WEBSITE_ID: ${NEXT_PUBLIC_UMAMI_WEBSITE_ID:-}
      # 🧠 Inférence embeddings auto-hébergée (service « embedding » ci-dessous).
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding:80}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jina-embeddings-v3}
      # Tâches typées jina-embeddings-v3 (TEI) — vide = champ omis (llama.cpp).
      EMBEDDING_INDEX_TASK: ${EMBEDDING_INDEX_TASK:-retrieval.passage}
      EMBEDDING_QUERY_TASK: ${EMBEDDING_QUERY_TASK:-retrieval.query}
      # Meilisearch (réseau Docker) — full-text search.
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-qoe_master_key_123}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-private
      - supabase_default

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 96M
          cpus: '0.5'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # ⚙️ WORKER-GO (asynq) : webhooks + newsletter + embeddings
  # ───────────────────────────────────────────────────────────────────
  worker-go:
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
    image: qoefi-worker-go:latest
    container_name: qoefi-worker-go
    restart: unless-stopped
    entrypoint: ['/usr/local/bin/qoe-worker']

    env_file:
      - .env.docker

    environment:
      REDIS_URL: redis://redis:6379
      # 🧠 Inférence embeddings auto-hébergée (même config que l'API).
      EMBEDDING_URL: ${EMBEDDING_URL:-http://embedding:80}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-jina-embeddings-v3}
      EMBEDDING_INDEX_TASK: ${EMBEDDING_INDEX_TASK:-retrieval.passage}
      # Meilisearch (réseau Docker) — full-text search.
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-qoe_master_key_123}

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    networks:
      - qoefi-private
      - supabase_default

    depends_on:
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.5'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 🧠 EMBEDDING (llama.cpp) — Inférence jina-embeddings-v3 auto-hébergée
  # ───────────────────────────────────────────────────────────────────
  # 📖 llama.cpp sert jina-embeddings-v3 (GGUF Q8_0) avec une API
  #    OpenAI-compatible (`/v1/embeddings`, 1024 dims, MRL tronqué à 512
  #    côté client Go). Consommé par l'API Go (`/search/semantic`) et le
  #    worker asynq.
  #    ⚠️ Le GGUF (~600 Mo) doit être placé dans `./models/` sur le host
  #    (téléchargé depuis HF : jina-embeddings-v3-Q8_0.gguf).
  #    ⚠️ Licence : jina-embeddings-v3 est CC BY-NC 4.0 (usage non
  #    commercial uniquement) — à valider pour la prod.
  # ───────────────────────────────────────────────────────────────────
  embedding:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: qoefi-embedding
    restart: unless-stopped

    expose:
      - '80'

    command: >
      -m /models/jina-embeddings-v3-Q8_0.gguf
      --embedding
      --pooling mean
      --port 80
      --host 0.0.0.0
      --ctx-size 8192
      --alias jina-embeddings-v3

    volumes:
      - ./models:/models:ro

    networks:
      - qoefi-private

    healthcheck:
      # L'image embarque un healthcheck sur :8080 ; notre serveur écoute :80.
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # ───────────────────────────────────────────────────────────────────
  # 🔄 REDIS : cache + queue (RÉSEAU PRIVÉ)
  # ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qoefi-redis
    restart: unless-stopped

    expose:
      - '6379'

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec

    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    networks:
      - qoefi-private

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 384M
          cpus: '0.5'

  # ───────────────────────────────────────────────────────────────────
  # 🔍 MEILISEARCH : Moteur de recherche (RÉSEAU PRIVÉ, aucun port public)
  # ───────────────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: qoefi-meilisearch
    restart: unless-stopped
    expose:
      - '7700'
    environment:
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY:-qoe_master_key_123}
      - MEILI_NO_ANALYTICS=true
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - qoefi-private

  # ───────────────────────────────────────────────────────────────────
  # 📊 UMAMI : Analytics self-hosted (cookie-less, gratuit)
  # ───────────────────────────────────────────────────────────────────
  umami-db:
    image: postgres:16-alpine
    container_name: qoefi-umami-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: ${UMAMI_DB_USER:-umami}
      POSTGRES_PASSWORD: ${UMAMI_DB_PASSWORD:-umami}
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - qoefi-private
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${UMAMI_DB_USER:-umami} -d umami']
      interval: 10s
      timeout: 3s
      retries: 5

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: qoefi-umami
    restart: unless-stopped
    expose:
      - '3000'
    environment:
      DATABASE_URL: postgresql://${UMAMI_DB_USER:-umami}:${UMAMI_DB_PASSWORD:-umami}@umami-db:5432/umami
      DATABASE_TYPE: postgresql
      HASH_SALT: ${UMAMI_HASH_SALT:-qoe_umami_salt_please_change}
      DISABLE_TELEMETRY: '1'
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - qoefi-private
      - qoefi-public
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ───────────────────────────────────────────────────────────────────
  # 🔄 MIGRATE : one-shot Prisma migrate deploy
  # ───────────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate # Stage dédié avec schema Prisma + migrations
    container_name: qoefi-migrate
    restart: 'no' # S'exécute une seule fois, ne redémarre pas

    env_file:
      - .env.docker

    # Les variables d'environnement DATABASE_URL et DIRECT_URL sont héritées directement du fichier .env.docker (Supabase Pooler)

    extra_hosts:
      - 'host.docker.internal:host-gateway'

    # 🔒 Réseau DB uniquement — rien d'autre à joindre
    networks:
      - supabase_default

# =====================================================================
# 🌐 RÉSEAUX
# =====================================================================
# qoefi-public   : caddy + frontends + kong/studio (exposé via Caddy)
# qoefi-private  : api/workers/redis/meili/embedding (interne)
# supabase_default : externe (créé par le stack Supabase) — DB uniquement
# =====================================================================
networks:
  qoefi-public:
    name: qoefi-public
    driver: bridge
  qoefi-private:
    name: qoefi-private
    driver: bridge
    internal: false # Doit pouvoir downloader (npm, etc.) au build
  supabase_default:
    external: true

# =====================================================================
# 📦 VOLUMES
# =====================================================================
volumes:
  redis_data:
    name: qoefi-redis-data
  caddy_data:
    name: qoefi-caddy-data
  caddy_config:
    name: qoefi-caddy-config
  meilisearch_data:
    name: qoefi-meilisearch-data
  umami_db_data:
    name: qoefi-umami-db-data
