# =====================================================================
# 🐳 docker-compose.yml — qoe.fi monorepo (PRODUCTION)
# =====================================================================
# 📖 8 services :
#   1. caddy     : reverse proxy + TLS auto
#   2. web       : Next.js public (start.qoe.fi + tenants)
#   3. console   : Next.js auth (qoe.fi, dashboard, admin)
#   4. api       : Hono backend (api.qoe.fi)
#   5. workers   : BullMQ jobs (emails, AI, billing)
#   6. db        : PostgreSQL + pgvector
#   7. redis     : Cache + queue
#   8. migrate   : Job one-shot Prisma migrate (s'exécute puis s'arrête)
#
# 🔒 Sécurité : db, redis, migrate sur réseau PRIVÉ uniquement
#                caddy, web, console, api, workers sur réseau PUBLIC + PRIVÉ
# =====================================================================

name: qoefi

services:
  # ───────────────────────────────────────────────────────────────────
  # 🚪 CADDY : reverse proxy + TLS (ports publics)
  # ───────────────────────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: qoefi-caddy
    restart: unless-stopped

    # Écoute uniquement sur le port 8080 en local (Nginx de l'hôte fera le reverse proxy)
    ports:
      - "127.0.0.1:8080:80"

    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

    # Caddy a besoin de connaître les autres services
    depends_on:
      web:
        condition: service_started
      feed:
        condition: service_started
      dashboard:
        condition: service_started
      admin:
        condition: service_started
      landing:
        condition: service_started
      api:
        condition: service_started

    networks:
      - qoefi-public

    # Resource limits
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 🌐 WEB : Next.js public
  # ───────────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: qoefi-web:latest
    container_name: qoefi-web
    restart: unless-stopped

    # PAS de port public : seul Caddy y accède
    expose:
      - "3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # URLs publiques (utilisées pour les redirects, emails, etc.)
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      # Supabase (lu côté serveur via l'app)
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "1.5"
        reservations:
          memory: 256M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 📣 LANDING : Next.js marketing (start.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      target: landing
    image: qoefi-landing:latest
    container_name: qoefi-landing
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 📰 FEED : Next.js public reader (qoe.fi / www.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  feed:
    build:
      context: .
      dockerfile: Dockerfile
      target: feed
    image: qoefi-feed:latest
    container_name: qoefi-feed
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 🎨 DASHBOARD : Next.js creator (dashboard.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
      target: dashboard
    image: qoefi-dashboard:latest
    container_name: qoefi-dashboard
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 🛡️ ADMIN : Next.js platform admin (admin.qoe.fi)
  # ───────────────────────────────────────────────────────────────────
  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin
    image: qoefi-admin:latest
    container_name: qoefi-admin
    restart: unless-stopped

    expose:
      - "3000"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_CONSOLE_URL: https://${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_LANDING_URL: https://start.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_API_URL: https://api.${PRIMARY_DOMAIN:-qoe.fi}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 🔌 API : Hono backend
  # ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    image: qoefi-api:latest
    container_name: qoefi-api
    restart: unless-stopped

    expose:
      - "3001"

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      PORT: 3001
      HOSTNAME: 0.0.0.0
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    networks:
      - qoefi-public
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # ⚙️ WORKERS : BullMQ background jobs
  # ───────────────────────────────────────────────────────────────────
  workers:
    build:
      context: .
      dockerfile: Dockerfile
      target: workers
    image: qoefi-workers:latest
    container_name: qoefi-workers
    restart: unless-stopped

    env_file:
      - .env.docker

    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Resend (emails)
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@qoe.fi}

    networks:
      - qoefi-private  # ⚠️ Pas besoin d'être public

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ───────────────────────────────────────────────────────────────────
  # 🐘 POSTGRES : DB principale (RÉSEAU PRIVÉ UNIQUEMENT)
  # ───────────────────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: qoefi-db
    restart: unless-stopped

    # ⚠️ PAS de port public : uniquement réseau Docker interne
    expose:
      - "5432"

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qoe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qoe}
      POSTGRES_DB: ${POSTGRES_DB:-qoe}
      # Encoding
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
      # Performance
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
      POSTGRES_MAINTENANCE_WORK_MEM: 128MB

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Backup local (volume séparé, monté depuis un cron)
      - postgres_backups:/backups

    networks:
      - qoefi-private  # 🔒 PRIVÉ

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qoe} -d ${POSTGRES_DB:-qoe}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: "2.0"

  # ───────────────────────────────────────────────────────────────────
  # 🔄 REDIS : cache + queue (RÉSEAU PRIVÉ)
  # ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: qoefi-redis
    restart: unless-stopped

    expose:
      - "6379"

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec

    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro

    networks:
      - qoefi-private

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  # ───────────────────────────────────────────────────────────────────
  # 🔄 MIGRATE : one-shot Prisma migrate deploy
  # ───────────────────────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate  # Stage dédié avec schema Prisma + migrations
    container_name: qoefi-migrate
    restart: "no"  # S'exécute une seule fois, ne redémarre pas

    env_file:
      - .env.docker

    # Les variables d'environnement DATABASE_URL et DIRECT_URL sont héritées directement du fichier .env.docker (Supabase Pooler)

    networks:
      - qoefi-private

    depends_on:
      db:
        condition: service_healthy

# =====================================================================
# 🌐 RÉSEAUX
# =====================================================================
# qoefi-public  : caddy ↔ web/console/api (HTTP interne)
# qoefi-private : web/console/api/workers ↔ db/redis (accès données)
# =====================================================================
networks:
  qoefi-public:
    name: qoefi-public
    driver: bridge
  qoefi-private:
    name: qoefi-private
    driver: bridge
    internal: false  # Doit pouvoir downloader (npm, etc.) au build

# =====================================================================
# 📦 VOLUMES
# =====================================================================
volumes:
  postgres_data:
    name: qoefi-postgres-data
  postgres_backups:
    name: qoefi-postgres-backups
  redis_data:
    name: qoefi-redis-data
  caddy_data:
    name: qoefi-caddy-data
  caddy_config:
    name: qoefi-caddy-config
