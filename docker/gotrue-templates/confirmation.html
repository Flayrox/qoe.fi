<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirmez votre email — Qoe</title>
</head>
<body style="margin:0;padding:0;background:#f6f7f9;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f9;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:12px;overflow:hidden;">
          <tr>
            <td style="padding:28px 32px;">
              <div style="font-size:22px;font-weight:700;color:#111;letter-spacing:-0.02em;">Qoe</div>
              <h1 style="font-size:18px;line-height:1.3;color:#111;margin:20px 0 8px;">Confirmez votre adresse email</h1>
              <p style="font-size:14px;line-height:1.6;color:#555;margin:0 0 22px;">Cliquez sur le bouton ci-dessous pour valider votre adresse email sur Qoe.</p>
              <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#111111;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 22px;border-radius:8px;">Confirmer mon email</a>
              <p style="font-size:13px;line-height:1.55;color:#8a8f98;margin:22px 0 0;">Si le bouton ne fonctionne pas, copiez ce lien dans votre navigateur&nbsp;:</p>
              <p style="font-size:12px;line-height:1.5;color:#5b616b;word-break:break-all;margin:4px 0 0;">{{ .ConfirmationURL }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
