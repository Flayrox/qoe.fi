# =====================================================================
# 🔄 Redis configuration — qoe.fi
# =====================================================================
# 📖 Configuration optimisée pour un usage cache + queue (BullMQ).
#    Les options en CLI dans docker-compose.yml peuvent override.
# =====================================================================

# Network
bind 0.0.0.0
protected-mode no
port 6379

# General
daemonize no
loglevel notice
logfile ""

# Memory (256 MB max, allkeys-LRU eviction)
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence
# Append-only file (AOF) pour durabilité (toutes les 1s)
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Timeouts
timeout 300
tcp-keepalive 60

# BullMQ-specific optimizations
# (Ces options sont importantes pour BullMQ)
# Activer les keyspace notifications (pour les jobs bloqués)
# notify-keyspace-events Ex
